<!DOCTYPE html>
<html lang="fa">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>کپی فایل reza.all</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            direction: rtl;
            padding: 20px;
            perspective: 1200px;
        }
        
        .container {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 32px;
            padding: 2.5rem;
            max-width: 750px;
            width: 100%;
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 
                0 30px 80px rgba(0, 0, 0, 0.6),
                0 0 0 1px rgba(255, 255, 255, 0.05) inset;
            transform: rotateX(2deg) rotateY(-1deg) translateZ(20px);
            animation: float 6s ease-in-out infinite;
            transition: all 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        
        @keyframes float {
            0%, 100% { transform: rotateX(2deg) rotateY(-1deg) translateZ(20px) translateY(0px); }
            50% { transform: rotateX(2deg) rotateY(-1deg) translateZ(30px) translateY(-10px); }
        }
        
        .container:hover {
            transform: rotateX(0deg) rotateY(0deg) translateZ(40px) scale(1.01);
        }
        
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.8rem;
            flex-wrap: wrap;
            gap: 12px;
        }
        
        .file-name {
            background: rgba(255, 255, 255, 0.08);
            padding: 0.5rem 1.4rem;
            border-radius: 60px;
            font-weight: 700;
            color: #e0e7ff;
            font-size: 1.2rem;
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            display: flex;
            align-items: center;
            gap: 10px;
            animation: glowPulse 3s ease-in-out infinite;
        }
        
        @keyframes glowPulse {
            0%, 100% { box-shadow: 0 0 20px rgba(99, 102, 241, 0.2); }
            50% { box-shadow: 0 0 40px rgba(99, 102, 241, 0.5); }
        }
        
        .file-name .icon {
            font-size: 1.4rem;
        }
        
        .file-name .badge {
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            color: white;
            padding: 0.1rem 0.9rem;
            border-radius: 30px;
            font-size: 0.75rem;
            letter-spacing: 0.5px;
        }
        
        .status-indicator {
            display: flex;
            align-items: center;
            gap: 8px;
            color: #a5b4fc;
            font-size: 0.85rem;
        }
        
        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #4ade80;
            animation: dotPulse 2s ease-in-out infinite;
            box-shadow: 0 0 20px rgba(74, 222, 128, 0.4);
        }
        
        @keyframes dotPulse {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.3); opacity: 0.7; }
        }
        
        .file-info {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 16px;
            padding: 1.2rem;
            margin-bottom: 1.5rem;
            border: 1px solid rgba(255, 255, 255, 0.05);
            text-align: center;
            color: #94a3b8;
            font-size: 0.9rem;
        }
        
        .file-info strong {
            color: #e2e8f0;
            font-size: 1.1rem;
        }
        
        .file-info .path {
            color: #818cf8;
            font-family: monospace;
            font-size: 0.85rem;
            background: rgba(0,0,0,0.2);
            padding: 0.2rem 0.8rem;
            border-radius: 8px;
            display: inline-block;
            margin-top: 4px;
        }
        
        .textarea-wrapper {
            position: relative;
            border-radius: 20px;
            background: rgba(0, 0, 0, 0.3);
            padding: 4px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            transition: all 0.4s ease;
        }
        
        .textarea-wrapper:focus-within {
            box-shadow: 0 8px 40px rgba(99, 102, 241, 0.3);
            transform: scale(1.01);
        }
        
        .glow-border {
            position: absolute;
            inset: -2px;
            border-radius: 22px;
            background: linear-gradient(135deg, #6366f1, #8b5cf6, #ec4899, #6366f1);
            background-size: 300% 300%;
            z-index: -1;
            animation: borderGlow 4s ease-in-out infinite;
            opacity: 0.5;
            transition: opacity 0.5s;
        }
        
        .textarea-wrapper:focus-within .glow-border {
            opacity: 1;
            animation-duration: 2s;
        }
        
        @keyframes borderGlow {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }
        
        textarea {
            width: 100%;
            height: 260px;
            padding: 1.2rem;
            border: none;
            border-radius: 18px;
            font-size: 1rem;
            line-height: 1.9;
            resize: vertical;
            background: rgba(15, 23, 42, 0.8);
            color: #e2e8f0;
            font-family: 'Courier New', monospace;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
        }
        
        textarea:focus {
            outline: none;
            background: rgba(15, 23, 42, 0.95);
        }
        
        textarea:read-only {
            cursor: default;
        }
        
        .button-group {
            display: flex;
            gap: 14px;
            margin-top: 1.8rem;
            flex-wrap: wrap;
        }
        
        .btn {
            padding: 0.8rem 2rem;
            border: none;
            border-radius: 60px;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            flex: 1;
            min-width: 130px;
            position: relative;
            overflow: hidden;
        }
        
        .btn::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, rgba(255,255,255,0.1), transparent);
            opacity: 0;
            transition: opacity 0.4s;
        }
        
        .btn:hover::before {
            opacity: 1;
        }
        
        .btn-copy {
            background: linear-gradient(135deg, #0b3b5c, #1a5a7a);
            color: white;
            box-shadow: 0 8px 25px rgba(11, 59, 92, 0.4);
        }
        
        .btn-copy:hover {
            transform: translateY(-4px) scale(1.02);
            box-shadow: 0 12px 40px rgba(11, 59, 92, 0.6);
        }
        
        .btn-copy:active {
            transform: scale(0.95) translateY(0);
        }
        
        .btn-refresh {
            background: linear-gradient(135deg, #7c3aed, #8b5cf6);
            color: white;
            box-shadow: 0 8px 25px rgba(124, 58, 237, 0.4);
        }
        
        .btn-refresh:hover {
            transform: translateY(-4px) scale(1.02);
            box-shadow: 0 12px 40px rgba(124, 58, 237, 0.6);
        }
        
        .btn-refresh:active {
            transform: scale(0.95) translateY(0);
        }
        
        .btn-success-anim {
            animation: successPop 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        
        @keyframes successPop {
            0% { transform: scale(1); }
            30% { transform: scale(1.15); }
            60% { transform: scale(0.95); }
            100% { transform: scale(1); }
        }
        
        .feedback {
            margin-top: 1.2rem;
            font-weight: 600;
            min-height: 2.2rem;
            text-align: center;
            font-size: 0.95rem;
            padding: 0.5rem 1rem;
            border-radius: 60px;
            background: rgba(0, 0, 0, 0.2);
            backdrop-filter: blur(10px);
            transition: all 0.5s ease;
        }
        
        .feedback.success {
            color: #4ade80;
            background: rgba(74, 222, 128, 0.1);
            border: 1px solid rgba(74, 222, 128, 0.2);
            animation: feedbackSlide 0.5s ease;
        }
        
        .feedback.error {
            color: #f87171;
            background: rgba(248, 113, 113, 0.1);
            border: 1px solid rgba(248, 113, 113, 0.2);
            animation: feedbackSlide 0.5s ease;
        }
        
        @keyframes feedbackSlide {
            0% { transform: translateY(-10px) scale(0.95); opacity: 0; }
            100% { transform: translateY(0) scale(1); opacity: 1; }
        }
        
        .footer {
            margin-top: 1.8rem;
            font-size: 0.75rem;
            color: rgba(148, 163, 184, 0.5);
            text-align: center;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            padding-top: 1.2rem;
            letter-spacing: 0.3px;
        }
        
        .footer span {
            background: rgba(255, 255, 255, 0.03);
            padding: 0.2rem 0.8rem;
            border-radius: 30px;
        }
        
        @media (max-width: 600px) {
            .container { padding: 1.5rem; }
            .btn { min-width: 100px; padding: 0.7rem 1.2rem; font-size: 0.9rem; }
            .file-name { font-size: 1rem; padding: 0.4rem 1rem; }
            textarea { height: 200px; }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <div class="file-name">
            <span class="icon">📄</span>
            reza.all
            <span class="badge">فایل</span>
        </div>
        <div class="status-indicator">
            <span class="status-dot"></span>
            <span>فعال</span>
        </div>
    </div>
    
    <div class="file-info">
        <div>📂 مسیر فایل: <strong class="path">/reza.all</strong></div>
        <div style="margin-top: 6px; font-size: 0.85rem; color: #64748b;">
            این فایل در ریشه پروژه گیت‌هاب قرار دارد
        </div>
    </div>
    
    <div class="textarea-wrapper">
        <div class="glow-border"></div>
        <textarea id="fileContent" readonly>در حال بارگذاری محتوای فایل reza.all...</textarea>
    </div>
    
    <div class="button-group">
        <button class="btn btn-copy" id="copyBtn">📋 کپی متن</button>
        <button class="btn btn-refresh" id="refreshBtn">🔄 بارگذاری مجدد</button>
    </div>
    
    <div id="feedback" class="feedback"></div>
    <div class="footer">
        <span>⚡ محتوای فایل reza.all · کپی با یک دکمه</span>
    </div>
</div>

<script>
    (function() {
        const textarea = document.getElementById('fileContent');
        const copyBtn = document.getElementById('copyBtn');
        const refreshBtn = document.getElementById('refreshBtn');
        const feedback = document.getElementById('feedback');
        
        // مسیر فایل reza.all در گیت‌هاب
        // توجه: این آدرس را با آدرس واقعی فایل در گیت‌هاب خود جایگزین کنید
        const FILE_URL = 'reza.all'; // فایل در همان دایرکتوری
        
        function showMessage(msg, isError = false) {
            feedback.textContent = msg;
            feedback.className = 'feedback';
            if (isError) {
                feedback.classList.add('error');
            } else {
                feedback.classList.add('success');
            }
            
            clearTimeout(window.msgTimeout);
            window.msgTimeout = setTimeout(() => {
                if (feedback.textContent === msg) {
                    feedback.textContent = '';
                    feedback.className = 'feedback';
                }
            }, 4000);
        }
        
        function animateButton(btn) {
            btn.classList.remove('btn-success-anim');
            void btn.offsetWidth;
            btn.classList.add('btn-success-anim');
        }
        
        // بارگذاری محتوای فایل از سرور
        function loadFileContent() {
            textarea.textContent = 'در حال بارگذاری...';
            textarea.style.color = '#94a3b8';
            
            fetch(FILE_URL)
                .then(response => {
                    if (!response.ok) {
                        throw new Error(`خطا در بارگذاری فایل: ${response.status} ${response.statusText}`);
                    }
                    return response.text();
                })
                .then(content => {
                    textarea.textContent = content;
                    textarea.style.color = '#e2e8f0';
                    showMessage('✅ فایل reza.all با موفقیت بارگذاری شد');
                })
                .catch(error => {
                    console.error('Error loading file:', error);
                    textarea.textContent = `❌ خطا در بارگذاری فایل: ${error.message}`;
                    textarea.style.color = '#f87171';
                    showMessage('❌ خطا در بارگذاری فایل', true);
                });
        }
        
        // کپی متن
        function copyText() {
            const text = textarea.textContent;
            
            if (!text || text.trim() === '' || text.includes('خطا') || text.includes('بارگذاری')) {
                showMessage('⚠️ محتوایی برای کپی وجود ندارد!', true);
                return;
            }
            
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(text)
                    .then(() => {
                        showMessage('✅ متن با موفقیت کپی شد!');
                        animateButton(copyBtn);
                        copyBtn.style.background = 'linear-gradient(135deg, #1f8b4c, #22c55e)';
                        setTimeout(() => {
                            copyBtn.style.background = '';
                        }, 800);
                    })
                    .catch(() => fallbackCopy(text));
            } else {
                fallbackCopy(text);
            }
        }
        
        function fallbackCopy(text) {
            const temp = document.createElement('textarea');
            temp.value = text;
            temp.setAttribute('readonly', '');
            temp.style.position = 'fixed';
            temp.style.left = '-9999px';
            temp.style.top = '0';
            document.body.appendChild(temp);
            try {
                temp.select();
                temp.setSelectionRange(0, text.length);
                const success = document.execCommand('copy');
                if (success) {
                    showMessage('✅ متن کپی شد');
                    animateButton(copyBtn);
                } else {
                    showMessage('❌ کپی نشد. متن را دستی کپی کنید.', true);
                }
            } catch (e) {
                showMessage('❌ خطا در کپی', true);
            } finally {
                document.body.removeChild(temp);
            }
        }
        
        // رویدادها
        copyBtn.addEventListener('click', copyText);
        refreshBtn.addEventListener('click', loadFileContent);
        
        // بارگذاری اولیه
        loadFileContent();
        
        // نمایش پیام راهنما
        setTimeout(() => {
            showMessage('📌 دکمه کپی را بزنید تا متن فایل reza.all کپی شود');
        }, 500);
        setTimeout(() => {
            if (feedback.textContent === '📌 دکمه کپی را بزنید تا متن فایل reza.all کپی شود') {
                feedback.textContent = '';
                feedback.className = 'feedback';
            }
        }, 4000);
    })();
</script>

</body>
  </html>
